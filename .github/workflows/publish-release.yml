name: Publish PF1 Waters Release

on:
  push:
    branches: [main]
    paths:
      - module.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pf1-waters-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
      - name: Verify code and regression tests
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.mjs; do node --check "$script"; done
          node --test tests/*.test.mjs
          node -e 'JSON.parse(require("node:fs").readFileSync("lang/fr.json","utf8"))'
      - name: Verify manifest, then build Foundry ZIP
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const m=require("./module.json");
          const base="https://github.com/Caelvanost/pf1-waters";
          if(m.id!=="pf1-waters"||m.version!=="1.5.5"||m.url!==base)throw Error("Module identity");
          if(m.manifest!=="https://raw.githubusercontent.com/Caelvanost/pf1-waters/main/module.json")throw Error("Manifest URL");
          if(m.download!==base+"/releases/download/v1.5.5/pf1-waters-v1.5.5.zip")throw Error("Download URL");
          JS
          mkdir -p dist
          zip -q -r dist/pf1-waters-v1.5.5.zip module.json scripts lang styles README.md CHANGELOG.md
          python - <<'PY'
          import json,zipfile
          with zipfile.ZipFile("dist/pf1-waters-v1.5.5.zip") as z:
              assert all(x in z.namelist() for x in ("module.json","scripts/main.mjs","scripts/api.mjs","lang/fr.json"))
              assert json.loads(z.read("module.json"))["id"]=="pf1-waters"
          PY
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.5.5
          archive=dist/pf1-waters-v1.5.5.zip
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$archive" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PF1 Waters v1.5.5" --notes "DD de Natation par corps d’eau et carte de test natif en combat."
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,assets,url
